# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: agent-harness
requiredVersions:
  azd: ">=1.34.2"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.7"
infra:
  provider: bicep
services:
  harness:
    name: agent-harness
    host: azure.ai.agent
    kind: hosted
    project: .
    language: docker
    description: Stateless governed MAF harness with Foundry endpoint RBAC.
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true
    protocols:
      - protocol: responses
        version: 2.0.0
    container:
      resources:
        cpu: "1"
        memory: 2Gi
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
