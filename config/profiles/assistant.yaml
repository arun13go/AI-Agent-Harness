# Bounded assistant profile without retrieval or direct actions.
# Validated by harness.schema.json; consumed by configuration.py.
schemaVersion: 1
profile: assistant
runtime:
  adapter: maf
  maxSteps: 12
  maxToolCalls: 4
  timeoutSeconds: 120
model:
  provider: foundry
  projectEndpointEnv: FOUNDRY_PROJECT_ENDPOINT
  deploymentNameEnv: AZURE_AI_MODEL_DEPLOYMENT_NAME
context:
  compaction: summarize
  maxInputTokens: 64000
retrieval:
  enabled: false
  adapter: none
  strategy: none
  answerability:
    enabled: false
    onInsufficientEvidence: clarify
memory:
  adapter: in-memory
  ttlDays: 30
state:
  adapter: in-memory
governance:
  maximumTier: propose
  approvalRequiredForAct: true
  auditEnabled: true
observability:
  exporter: console
  payloadCapture: false
