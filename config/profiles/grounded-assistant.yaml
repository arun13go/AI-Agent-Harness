# Read-only assistant profile requiring retrieval and answerability checks.
# Validated by harness.schema.json; consumed by configuration.py.
schemaVersion: 1
profile: grounded-assistant
runtime:
  adapter: maf
  maxSteps: 12
  maxToolCalls: 4
  timeoutSeconds: 120
model:
  provider: foundry
  projectEndpointEnv: FOUNDRY_PROJECT_ENDPOINT
  deploymentNameEnv: AZURE_AI_MODEL_DEPLOYMENT_NAME
context:
  compaction: truncate-oldest
  maxInputTokens: 64000
retrieval:
  enabled: true
  adapter: azure-ai-search
  strategy: semantic
  # The service address comes from the named environment variable, never from this file.
  search:
    endpointEnv: AZURE_SEARCH_ENDPOINT
    indexName: harness-chunks
  # Reranker scores run 0 to 4, so 0.625 means 2.5. Chosen on a small synthetic evaluation
  # set (ADR 0023); recheck it on your own questions before relying on it.
  minimumScore: 0.625
  limit: 8
  maximumAttempts: 1
  answerability:
    enabled: true
    onInsufficientEvidence: clarify
memory:
  adapter: in-memory
  ttlDays: 30
state:
  adapter: in-memory
governance:
  maximumTier: read
  approvalRequiredForAct: true
  auditEnabled: true
observability:
  exporter: console
  payloadCapture: false
