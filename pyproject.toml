# Defines packaging, dependencies, CLI entry points, and validation tools.
# Consumed by uv, Hatch, Pyright, pytest, and Ruff.
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-harness"
version = "0.1.0"
description = "Governed, observable, and evaluable AI agent harness for Azure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core==1.19.0",
    "agent-framework-foundry==1.13.1",
    "azure-ai-agentserver-core==2.2.0",
    "azure-ai-agentserver-responses==2.3.0",
    "azure-identity==1.26.0",
    "azure-monitor-opentelemetry-exporter==1.0.0b58",
    "jsonschema==4.26.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "starlette==1.8.0",
]

[project.scripts]
agent-harness = "agent_harness.app.cli:main"

[dependency-groups]
dev = [
    "debugpy==1.8.20",
    "httpx==0.28.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
required-version = "==0.11.15"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "D100"]
